<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三字成诗</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#2c2a28;
    --paper:#faf6ef;
    --paper2:#f3ecdf;
    --gold:#b8860b;
    --gold2:#c9a227;
    --muted:#8a8378;
    --line:rgba(44,42,40,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    background:#e8e4dc;
    display:flex;justify-content:center;align-items:stretch;
    height:100vh;min-height:100vh;color:var(--ink);padding:0;
  }
  .phone{
    width:390px;max-width:100vw;height:100vh;height:100dvh;
    background:var(--paper);border-radius:36px;
    box-shadow:0 20px 60px rgba(0,0,0,.18);
    position:relative;overflow:hidden;display:flex;flex-direction:column;
  }
  .screen{display:none;flex:1;flex-direction:column;position:relative;overflow-y:auto;animation:fade .35s ease;}
  .screen.active{display:flex;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* 首页 */
  .home{padding:48px 28px 12px;display:flex;flex-direction:column;min-height:100%;box-sizing:border-box;}
  .slogan{font-family:"STKaiti","Kaiti SC","KaiTi","SimSun",serif;font-weight:400;font-size:22px;text-align:center;margin:0 0 36px;letter-spacing:3px;}
  .slogan b{color:var(--gold);font-weight:400;}
  .sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:34px;}
  .words{display:flex;flex-direction:column;gap:14px;}
  .word-input{
    background:transparent;border:none;border-bottom:1px solid var(--line);
    font-size:22px;font-family:"STKaiti","KaiTi","Songti SC","SimSun",serif;
    text-align:center;padding:12px 4px;color:var(--ink);outline:none;
    transition:border-color .2s;
  }
  .word-input:focus{border-bottom-color:var(--gold);}
  .word-input::placeholder{color:#c6bfae;font-size:18px;}
  .tags{margin:22px 0 0;display:flex;gap:8px;overflow-x:auto;padding:4px 2px;scrollbar-width:none;}
  .tags::-webkit-scrollbar{display:none;}
  .tag{
    flex:0 0 auto;font-size:13px;color:var(--muted);border:1px solid var(--line);
    border-radius:999px;padding:7px 14px;background:transparent;cursor:pointer;transition:.15s;
  }
  .tag:hover{color:var(--gold);border-color:var(--gold);}
  .btn{
    margin-top:26px;background:var(--ink);color:var(--paper);border:none;border-radius:14px;
    padding:16px;font-size:16px;letter-spacing:6px;cursor:pointer;width:100%;
    font-family:inherit;transition:.2s;
  }
  .btn:hover{background:#1c1a18;}
  .quota{text-align:center;font-size:12px;color:var(--muted);margin-top:14px;}
  .quota b{color:var(--gold);font-weight:500;}
  .copyright{text-align:center;font-size:11px;color:#c0b8a8;margin-top:auto;padding-bottom:8px;letter-spacing:1px;}

  /* 生成中 */
  .loading{align-items:center;justify-content:center;gap:22px;}
  .loading .orb{width:64px;height:64px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--gold);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading p{font-family:"STKaiti","KaiTi","SimSun",serif;font-size:15px;color:var(--muted);letter-spacing:2px;}

  /* 诗页 */
  .poem{padding:0;}
  .art{height:250px;position:relative;overflow:hidden;}
  .art-title{position:absolute;top:32px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:10px;font-family:"STKaiti","KaiTi","SimSun",serif;opacity:.8;}
  .art-color{position:absolute;right:18px;bottom:14px;font-size:22px;letter-spacing:6px;font-weight:600;font-family:"STKaiti","KaiTi","SimSun",serif;opacity:1;}
  .art svg{position:absolute;left:0;bottom:-2px;width:100%;}
  .poem-body{flex:1;display:flex;flex-direction:column;padding:20px 24px 10px;align-items:center;}
  .verse{
    font-family:"STKaiti","KaiTi","Songti SC","SimSun",serif;
    writing-mode:vertical-rl;height:250px;font-size:16px;letter-spacing:4px;
    color:var(--ink);line-height:1.9;margin:0 auto;
  }
  .date-line{font-family:"STKaiti","KaiTi","SimSun",serif;font-size:12px;color:var(--muted);letter-spacing:2px;margin-top:14px;}
  .styles{display:flex;gap:8px;margin-top:16px;}
  .style-chip{
    font-size:12px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);
    color:var(--muted);background:transparent;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .style-chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .actions{display:flex;gap:12px;margin-top:16px;width:100%;}
  .act{
    flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);
    background:transparent;font-size:14px;color:var(--ink);cursor:pointer;font-family:inherit;transition:.15s;
  }
  .act:hover{border-color:var(--gold);color:var(--gold);}
  .act.primary{background:var(--gold2);border-color:var(--gold2);color:#fff;letter-spacing:3px;}
  .act.primary:hover{background:var(--gold);}

  /* 诗集 */
  .list{padding:48px 24px 20px;}
  .list h2{font-family:"STKaiti","KaiTi","SimSun",serif;font-size:22px;letter-spacing:3px;text-align:center;margin-bottom:36px;font-weight:400;}
  .empty{text-align:center;color:var(--muted);font-size:14px;margin-top:60px;line-height:2;}
  .poem-item{
    border-bottom:1px solid var(--line);padding:16px 4px;display:flex;justify-content:space-between;align-items:center;
  }
  .poem-item .poem-main{flex:1;cursor:pointer;}
  .poem-item .meta{font-size:12px;color:var(--muted);}
  .poem-item .txt{font-family:"STKaiti","KaiTi","SimSun",serif;font-size:15px;margin-top:6px;color:var(--ink);white-space:pre-line;letter-spacing:2px;}
  .poem-item .del{font-size:12px;color:#c0b8a8;cursor:pointer;padding:6px;}

  /* 设置 */
  .settings{padding:48px 28px 20px;}
  .settings h2{font-family:"STKaiti","KaiTi","SimSun",serif;font-size:22px;letter-spacing:3px;text-align:center;margin-bottom:36px;font-weight:400;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:18px 4px;border-bottom:1px solid var(--line);}
  .row .lab{font-size:15px;}
  .row .hint{font-size:12px;color:var(--muted);margin-top:4px;}
  .time-input{font-family:inherit;font-size:12px;background:transparent;border:none;border-bottom:1px solid var(--gold2);color:var(--gold2);padding:0 2px;width:56px;text-align:center;outline:none;}
  .switch{position:relative;width:48px;height:28px;background:#d9d2c2;border-radius:999px;cursor:pointer;transition:.2s;border:none;}
  .switch.on{background:var(--gold2);}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s;}
  .switch.on::after{transform:translateX(20px);}

  /* 底部 tab */
  .tabbar{display:flex;border-top:1px solid var(--line);background:var(--paper2);flex-shrink:0;}
  .tab{
    flex:1;padding:14px 0 20px;text-align:center;font-size:13px;color:var(--muted);
    cursor:pointer;font-family:inherit;border:none;background:transparent;letter-spacing:1px;transition:.15s;
  }
  .tab.on{color:var(--ink);font-weight:500;}

  /* toast */
  .toast{
    position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(10px);
    background:rgba(44,42,40,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;
    opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;z-index:9;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 详情页 */
  .detail{display:flex;flex-direction:column;min-height:100%;}
  .detail-art{position:relative;height:260px;overflow:hidden;}
  .detail-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:26px 30px 20px;}
  .detail-verse{font-family:"STKaiti","KaiTi","Songti SC","SimSun",serif;font-size:17px;line-height:2;text-align:center;white-space:pre-line;}
  .detail-date{font-family:"STKaiti","KaiTi","SimSun",serif;font-size:13px;color:var(--muted);letter-spacing:2px;margin-top:22px;}
  .back-btn{margin-top:30px;padding:12px 46px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:14px;color:var(--ink);cursor:pointer;font-family:inherit;letter-spacing:4px;}

  /* 分享弹窗 */
  .modal{position:absolute;inset:0;z-index:20;display:none;}
  .modal.show{display:block;}
  .modal-mask{position:absolute;inset:0;background:rgba(20,18,16,.5);}
  .modal-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;background:#fff;border-radius:16px;overflow:hidden;padding:14px;}
  .card-art{position:relative;border-radius:20px;border:10px solid #ffffff;padding:64px 32px 52px;min-height:380px;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;}
  .card-title{font-family:"STKaiti","Kaiti SC","KaiTi","SimSun",serif;font-weight:300;font-size:12px;letter-spacing:8px;}
  .card-words{font-family:"STKaiti","Kaiti SC","KaiTi","SimSun",serif;font-weight:300;font-size:15px;letter-spacing:6px;margin-top:14px;}
  .card-verse{font-family:"STKaiti","Kaiti SC","Songti SC","SimSun",serif;font-size:16px;line-height:2.4;text-align:center;margin-top:26px;white-space:pre-line;}
  .card-foot{position:absolute;bottom:24px;left:28px;right:28px;display:flex;justify-content:space-between;font-family:"STKaiti","KaiTi","SimSun",serif;font-size:12px;opacity:.75;}
  .card-actions{display:flex;gap:12px;margin-top:14px;}
  .card-btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:14px;color:var(--ink);cursor:pointer;font-family:inherit;text-align:center;}
  .card-btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;letter-spacing:2px;}
</style>
</head>
<body>
<div class="phone" id="phone">

  <!-- 首页 -->
  <div class="screen active" id="home">
    <div class="home">
      <div class="slogan">三字成诗</div>
      <div class="sub">写下此刻的三个字，换一首属于此时的诗</div>
      <div class="words">
        <input class="word-input" id="w1" placeholder="第一个字" maxlength="8">
        <input class="word-input" id="w2" placeholder="第二个字" maxlength="8">
        <input class="word-input" id="w3" placeholder="第三个字" maxlength="8">
      </div>
      <div class="tags" id="tags"></div>
      <button class="btn" id="go">写 一 首</button>
      <div class="quota">今日剩余 <b id="quotaNum">3</b> 次</div>
      <div class="copyright">© 2026 三字成诗</div>
    </div>
  </div>

  <!-- 生成中 -->
  <div class="screen loading" id="loading">
    <div class="orb"></div>
    <p id="loadingText">正在研磨你的三个词…</p>
  </div>

  <!-- 诗页 -->
  <div class="screen" id="poem">
    <div class="poem">
      <div class="art" id="art"><div class="moon"></div><svg id="mounts" viewBox="0 0 390 120" preserveAspectRatio="none"></svg></div>
      <div class="poem-body">
        <div class="verse" id="verse"></div>
        <div class="date-line" id="dateLine"></div>
        <div class="styles" id="styles"></div>
        <div class="actions">
          <button class="act" id="again">换一首</button>
          <button class="act" id="save">收藏</button>
          <button class="act primary" id="share">分享</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 诗集 -->
  <div class="screen" id="list">
    <div class="list">
      <h2>我的诗集</h2>
      <div id="listBody"></div>
    </div>
  </div>

  <!-- 设置 -->
  <div class="screen" id="settings">
    <div class="settings">
      <h2>设 置</h2>
      <div class="row">
        <div><div class="lab">每日提醒</div><div class="hint">每日 <input type="time" class="time-input" id="remindTime" value="08:00"> 诗兴大发</div></div>
        <button class="switch" id="remindSwitch"></button>
      </div>
      <div class="row">
        <div><div class="lab">关于</div><div class="hint">三字成诗 · Demo v0.1</div></div>
      </div>
    </div>
  </div>

  <!-- 详情页 -->
  <div class="screen" id="detail">
    <div class="detail">
      <div class="detail-art" id="detailArt">
        <div class="art-title serif">三 字 成 诗</div>
        <div class="art-color serif" id="detailColor"></div>
      </div>
      <div class="detail-body">
        <div class="detail-verse serif" id="detailVerse"></div>
        <div class="detail-date" id="detailDate"></div>
        <button class="back-btn" id="backBtn">返 回</button>
      </div>
    </div>
  </div>

  <!-- 分享弹窗 -->
  <div class="modal" id="shareModal">
    <div class="modal-mask" id="shareMask"></div>
    <div class="modal-card">
      <div class="card-art" id="cardArt">
        <div class="card-title serif" id="cardTitle">三 字 成 诗</div>
        <div class="card-words serif" id="cardWords"></div>
        <div class="card-verse serif" id="cardVerse"></div>
        <div class="card-foot serif"><span id="cardDate"></span><span id="cardColor"></span></div>
      </div>
      <div class="card-actions">
        <button class="card-btn" id="saveImg">保存相册</button>
        <button class="card-btn primary" id="wechatShare">微信</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="tabbar">
    <button class="tab on" data-tab="home">写诗</button>
    <button class="tab" data-tab="list">诗集</button>
    <button class="tab" data-tab="settings">设置</button>
  </div>
</div>

<script>

  var STYLES = ["古风","现代","治愈","励志","清醒"];
  var TEMPLATES = {
    "古风":[

      ["若{w1}是山","{w2}便是山间的雾","{w3}是雾散之后","那一步，终究没跨出"],

      ["山里有{w1}，山外有{w2}","我什么也没有","只带着{w3}","等风来认领"],

    ],

      ["今天没有{w1}","也没有{w2}","我站在阳台","看{w3}慢慢把天黑下来"],
      ["{w1}旧了，{w2}也旧了","只有手机里的{w3}","还在自动续费"]

    "治愈":[
      ["没关系的","{w1}会慢慢变成{w2}","{w2}又会变成{w3}","而你，什么都不用变"],

      ["今天的{w1}有点累","没关系","{w2}已经在路上了","{w3}也是"],
      ["如果{w1}让你难过","就把{w2}放下","抱一抱{w3}","它比你想象中更想陪你"],
      ["慢慢来","{w1}会好起来","{w2}会好起来","{w3}也会，都会的"],
      ["你不必总是{w1}","偶尔{w2}也没关系","你看，{w3}正在窗边晒太阳","什么都没做，也很好"],
      ["把今天的{w1}交给明天","把{w2}交给风","你只管抱着{w3}","睡一个好觉"],

    "励志":[
      ["带着{w1}出发","把{w2}揣进怀里","{w3}就在前面","只是别跑太快，路会疼"],
      ["若{w1}拦住去路","就带着{w2}绕过去","{w3}在山顶","也在你的鞋底"],
      ["别怕{w1}","它是来给你带路的","绕过{w2}","{w3}就在下一个转弯"],
      ["{w1}再小，也是你的","{w2}再慢，也在走","{w3}再远","也远不过你的步子"],

    "清醒":[

  var COLOR_CARD = [
    {name:"月白",hex:"#EEF3F0"},
    {name:"米汤娇",hex:"#F3EFE6"},
    {name:"缟羽",hex:"#F7F6F2"},
    {name:"凝脂",hex:"#EAE3D5"},
    {name:"天青",hex:"#98B4A6"},
    {name:"远山黛",hex:"#B4C2BE"},
    {name:"缥碧",hex:"#8AA8A1"},
    {name:"黛蓝",hex:"#2B3E47"},
    {name:"竹青",hex:"#789262"},
    {name:"苍葭",hex:"#A3B19B"},
    {name:"艾绿",hex:"#9BA493"},
    {name:"缃叶",hex:"#DFC286"},
    {name:"秋香",hex:"#B59B6D"},
    {name:"茶褐",hex:"#6E5748"},
    {name:"朱砂",hex:"#B84A39"},
    {name:"绛紫",hex:"#6B3A42"},
    {name:"檀粉",hex:"#D6A692"},
    {name:"烟雨灰",hex:"#4A4B47"},
    {name:"青砖",hex:"#7D8280"},
    {name:"玄墨",hex:"#262422"}
  ];
  var FILLERS = ["正在研磨你的三个词…","正在铺开一张纸…","正在蘸墨…","正在等风来…"];

  // 敏感词过滤（基础词库，覆盖通用违禁类别；政治/邪教类建议接入官方内容安全 API）
  var SENSITIVE_WORDS = [
    "色情","裸聊","黄片","嫖娼","卖淫","淫秽",
    "杀人","谋杀","炸弹","砍死",
    "赌博","博彩","六合彩","下注","赌钱",
    "毒品","冰毒","大麻","海洛因","吸毒","嗑药",
    "诈骗","办假证","代开发票","洗钱",
    "傻逼","妈的","操你","去死",
    "法轮功","法轮大法"
  ];
  function containsSensitive(text){
    var t=(text||"").trim();
    if(!t){return null;}
    for(var i=0;i<SENSITIVE_WORDS.length;i++){
      if(t.indexOf(SENSITIVE_WORDS[i])!==-1){return SENSITIVE_WORDS[i];}
    }
    return null;
  }
  function checkWords(arr){
    var list=(arr||[]).map(function(w){return (w||"").trim();}).filter(Boolean);
    var n=list.length;
    if(!n){return null;}
    var i,j,k,h;
    for(i=0;i<n;i++){h=containsSensitive(list[i]);if(h){return h;}}
    for(i=0;i<n;i++){
      for(j=0;j<n;j++){
        if(i!==j){h=containsSensitive(list[i]+list[j]);if(h){return h;}}
      }
    }
    for(i=0;i<n;i++){
      for(j=0;j<n;j++){
        if(i===j){continue;}
        for(k=0;k<n;k++){
          if(k===i||k===j){continue;}
          h=containsSensitive(list[i]+list[j]+list[k]);if(h){return h;}
        }
      }
    }
    return null;
  }

  var words = ["","",""];
  var curStyle = "古风";
  var curPoem = "";
  var curColor = null;
  var lastSkeleton = null;
  var shareFile = null;

  var $ = function(id){return document.getElementById(id);};
  function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
  function quota(){
    var k="poem_quota_"+today();
    var v=localStorage.getItem(k);
    return v===null?3:parseInt(v,10);
  }
  function setQuota(n){localStorage.setItem("poem_quota_"+today(),n);$("quotaNum").textContent=Math.max(0,n);}
  function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show");},1800);}

  // 心情标签
  var TAGS=["清晨","咖啡","远方","想念","焦虑","加班","期待","回家","海","山"];
  var tagWrap=$("tags");
  TAGS.forEach(function(t){
    var b=document.createElement("button");b.className="tag";b.textContent=t;
    b.onclick=function(){
      var inputs=[$("w1"),$("w2"),$("w3")];
      var empty=inputs.filter(function(i){return !i.value;});
      if(empty.length){empty[0].value=t;empty[0].focus();}else{toast("三个词已满，可换掉其中一个");}
    };
    tagWrap.appendChild(b);
  });

  // 生成
  function pick(arr,n){var a=arr.slice();var r=[];while(r.length<n&&a.length){r.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);}return r;}
  function shuffle(a){
    var arr=a.slice();
    for(var i=arr.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=arr[i];arr[i]=arr[j];arr[j]=t;
    }
    return arr;
  }
  function buildPoem(style){
    var pool=TEMPLATES[style];
    var fill=shuffle(words.map(function(x){return x||"此刻";}));
    var sk;
    if(pool.length>1){
      var guard=0;
      do{sk=pick(pool,1)[0];guard++;}while(sk===lastSkeleton&&guard<8);
    }else{
      sk=pool[0];
    }
    lastSkeleton=sk;
    return sk.map(function(l){return l.replace("{w1}",fill[0]).replace("{w2}",fill[1]).replace("{w3}",fill[2]);}).join("\n");
  }
  function renderArt(){
    var c=COLOR_CARD[Math.floor(Math.random()*COLOR_CARD.length)];
    curColor=c;
    var art=$("art");
    art.style.background=c.hex;
    var ink=isDark(c.hex)?"#F7F6F2":"#262422";
    art.innerHTML=
      '<div class="art-title" style="color:'+ink+'">三 字 成 诗</div>'+
      '<div class="art-color" style="color:'+ink+'">'+c.name+'</div>';
    applyBtnColor(c);
  }
  function isDark(hex){
    var r=parseInt(hex.slice(1,3),16);
    var g=parseInt(hex.slice(3,5),16);
    var b=parseInt(hex.slice(5,7),16);
    return (0.299*r+0.587*g+0.114*b)<150;
  }
  function shade(hex,f){
    var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    r=Math.round(r*(1-f));g=Math.round(g*(1-f));b=Math.round(b*(1-f));
    return "rgb("+r+","+g+","+b+")";
  }
  function applyBtnColor(c){
    var primary=$("share");
    primary.style.background=c.hex;
    primary.style.borderColor=c.hex;
    primary.style.color=isDark(c.hex)?"#F7F6F2":"#262422";
    var sub=shade(c.hex,0.35);
    var subBorder=shade(c.hex,0.15);
    ["again","save"].forEach(function(id){
      var b=$(id);
      b.style.color=sub;
      b.style.borderColor=subBorder;
    });
  }
  function renderPoem(){
    curPoem=buildPoem(curStyle);
    $("verse").textContent=curPoem;
    var d=new Date();
    var week="日一二三四五六"[d.getDay()];
    $("dateLine").textContent=d.getMonth()+1+" 月 "+d.getDate()+" 日 · 星期"+week+" · "+words.filter(Boolean).join(" / ");
    renderArt();
  }
  function renderStyles(){
    var w=$("styles");w.innerHTML="";
    STYLES.forEach(function(s){
      var b=document.createElement("button");b.className="style-chip"+(s===curStyle?" on":"");b.textContent=s;
      b.onclick=function(){curStyle=s;renderStyles();renderPoem();};
      w.appendChild(b);
    });
  }

  $("go").onclick=function(){
    words=[$("w1").value.trim(),$("w2").value.trim(),$("w3").value.trim()];
    if(words.some(function(x){return !x;})){toast("请写满三个字，再写一首");return;}
    if(checkWords(words)){toast("包含不合规内容，请换个词");return;}
    showScreen("loading");
    $("loadingText").textContent=FILLERS[Math.floor(Math.random()*FILLERS.length)];
    setTimeout(function(){
      renderStyles();renderPoem();
      var q=quota()-1;setQuota(q);
      if(q<0){toast("今日免费次数已用完，继续使用请用真心");}
      showScreen("poem");
    },1300);
  };

  $("again").onclick=function(){renderPoem();toast("换了一首");};
  $("save").onclick=function(){
    var list=JSON.parse(localStorage.getItem("poems")||"[]");
    list.unshift({
      date:today(),
      words:words.filter(Boolean).join(" / "),
      text:curPoem,
      style:curStyle,
      colorName:curColor?curColor.name:"",
      colorHex:curColor?curColor.hex:""
    });
    localStorage.setItem("poems",JSON.stringify(list));
    toast("已收藏到诗集");
  };
  $("share").onclick=function(){
    if(!curColor||!curPoem){toast("先写一首诗吧");return;}
    openShareModal(curColor,curPoem,words.filter(Boolean).join(" · "));
  };
  function openShareModal(color,poem,wordStr){
    var dark=isDark(color.hex);
    var ink=dark?"#F7F6F2":"#262422";
    var art=$("cardArt");
    art.style.background=color.hex;
    art.querySelectorAll(".card-title,.card-words,.card-verse,.card-foot").forEach(function(e){e.style.color=ink;});
    $("cardWords").textContent=wordStr||"";
    $("cardVerse").textContent=poem;
    var d=new Date();
    var week="日一二三四五六"[d.getDay()];
    $("cardDate").textContent=(d.getMonth()+1)+" 月 "+d.getDate()+" 日 · 星期"+week;
    $("cardColor").textContent=color.name;
    $("shareModal").classList.add("show");
    // 预生成诗卡图片（供微信分享 / 保存相册使用）
    shareFile=null;
    if(window.html2canvas){
      html2canvas($("cardArt"),{scale:3,backgroundColor:"#ffffff",useCORS:true}).then(function(canvas){
        canvas.toBlob(function(blob){
          if(blob){shareFile=new File([blob],"三字成诗.png",{type:"image/png"});}
        },"image/png");
      }).catch(function(){});
    }
  }
  $("shareMask").onclick=function(){$("shareModal").classList.remove("show");};
  $("saveImg").onclick=function(){
    if(shareFile){
      var url=URL.createObjectURL(shareFile);
      var a=document.createElement('a');
      a.download="三字成诗.png";
      a.href=url;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},1000);
      toast("海报已保存");
      return;
    }
    if(!window.html2canvas){toast("保存组件加载中，请重试");return;}
    html2canvas($("cardArt"),{scale:3,backgroundColor:"#ffffff",useCORS:true}).then(function(canvas){
      var a=document.createElement('a');
      a.download="三字成诗.png";
      a.href=canvas.toDataURL("image/png");
      document.body.appendChild(a);a.click();a.remove();
      toast("海报已保存");
    }).catch(function(){toast("保存失败，请截图");});
  };
  $("wechatShare").onclick=function(){
    var txt=curPoem.replace(/\n/g,"，");
    // 优先以图片文件发起分享（iOS/安卓系统分享面板可直接发微信）
    if(shareFile&&navigator.canShare&&navigator.canShare({files:[shareFile]})){
      navigator.share({files:[shareFile],title:"三字成诗",text:txt}).catch(function(){});
      return;
    }
    if(navigator.share){
      navigator.share({title:"三字成诗",text:txt}).catch(function(e){
        if(e&&e.name!=="AbortError"){fallbackCopy();}
      });
    }else{
      fallbackCopy();
    }
  };
  function fallbackCopy(){
    if(navigator.clipboard){
      navigator.clipboard.writeText(curPoem.replace(/\n/g,"，")).then(function(){toast("已复制，粘贴到微信即可");});
    }else{
      toast("请用「保存相册」后发微信");
    }
  }
  function renderList(){
    var list=JSON.parse(localStorage.getItem("poems")||"[]");
    var body=$("listBody");
    if(!list.length){body.innerHTML='<div class="empty">还没有诗，去写一首</div>';return;}
    body.innerHTML="";
    list.forEach(function(p,i){
      var d=document.createElement("div");d.className="poem-item";
      d.innerHTML='<div class="poem-main"><div class="meta">'+p.date+" · "+p.words+'</div><div class="txt">'+p.text+'</div></div><span class="del" data-i="'+i+'">删除</span>';
      d.querySelector(".poem-main").onclick=function(){showDetail(p);};
      d.querySelector(".del").onclick=function(e){
        e.stopPropagation();
        var list=JSON.parse(localStorage.getItem("poems")||"[]");
        list.splice(parseInt(this.dataset.i,10),1);
        localStorage.setItem("poems",JSON.stringify(list));
        renderList();toast("已删除");
      };
      body.appendChild(d);
    });
  }

  function showDetail(p){
    var hex=p.colorHex||"#F7F6F2";
    var dark=isDark(hex);
    var ink=dark?"#F7F6F2":"#262422";
    var art=$("detailArt");
    art.style.background=hex;
    art.querySelector(".art-title").style.color=ink;
    art.querySelector(".art-color").style.color=ink;
    $("detailVerse").textContent=p.text;
    $("detailColor").textContent=p.colorName||"";
    $("detailDate").textContent=p.date+" · "+p.words+(p.style?" · "+p.style:"");
    showScreen("detail");
  }
  $("backBtn").onclick=function(){showScreen("list");};

  var remindKey="poem_remind";
  var remindTimeKey="poem_remind_time";
  function renderRemind(){
    var on=localStorage.getItem(remindKey)==="1";
    $("remindSwitch").classList.toggle("on",on);
    var t=localStorage.getItem(remindTimeKey)||"08:00";
    var ti=$("remindTime");
    if(ti){ti.value=t;}
  }
  $("remindSwitch").onclick=function(){
    var on=localStorage.getItem(remindKey)==="1";
    localStorage.setItem(remindKey,on?"0":"1");
    renderRemind();toast(on?"提醒已关闭":"到点提醒你诗兴大发");
  };
  $("remindTime").onchange=function(){
    localStorage.setItem(remindTimeKey,this.value);
    toast("提醒时间已设为 "+this.value);
  };

  function showScreen(id){
    document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("active");});
    $(id).classList.add("active");
    document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("on",t.dataset.tab===id);});
  }
  document.querySelectorAll(".tab").forEach(function(t){
    t.onclick=function(){
      showScreen(t.dataset.tab);
      if(t.dataset.tab==="list")renderList();
    };
  });

  setQuota(quota());
  renderRemind();
})();
</script>
</body>
</html>
